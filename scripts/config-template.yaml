# Kodla Configuration
# Generated by /kodla:init — edit as needed.
# All sections are optional; defaults are used when not specified.

# =============================================================================
# Language Settings
# =============================================================================

language:
  # Language for AI-agent communication (prompts, questions, explanations)
  # Options: en, ru, de, fr, es, zh, ja, ko, pt, it
  # Default: ru
  ui: ru

  # Language for generated artifacts (plans, descriptions, documentation)
  # Options: en, ru, de, fr, es, zh, ja, ko, pt, it
  # Default: ru
  artifacts: ru

  # How to handle technical terms in translations
  # Options: keep (preserve English terms) | translate
  # Default: keep
  technical_terms: keep

  # Language for comments written in generated/edited code
  # Options: en, ru, de, fr, es, zh, ja, ko, pt, it
  # Default: ru
  code_comments: ru

# =============================================================================
# Path Configuration
# =============================================================================

paths:
  # Project description file
  description: .kodla/DESCRIPTION.md

  # Architecture guidelines file
  architecture: .kodla/ARCHITECTURE.md

  # Top-level project rules file
  rules_file: .kodla/RULES.md

  # Rules directory (area-specific rules)
  rules: .kodla/rules/

  # Implementation plans directory
  plans: .kodla/plans/

  # Saved research file
  research: .kodla/RESEARCH.md

  # Project roadmap file
  roadmap: .kodla/ROADMAP.md

  # Bug-fix plan file
  fix_plan: .kodla/FIX_PLAN.md

  # Experience patches directory
  patches: .kodla/patches/

  # Skill evolution reports directory
  evolutions: .kodla/evolutions/

  # Reusable knowledge references directory
  references: .kodla/references/

  # Detailed project documentation directory
  docs: docs/

  # Main Tasar specifications directory
  specs: tasar/specs/

# =============================================================================
# Workflow Settings
# =============================================================================

workflow:
  # Automatically create .kodla/ directories when missing
  auto_create_dirs: true

  # Verification strictness: normal | strict
  verify_mode: normal

# =============================================================================
# Rules Hierarchy
# =============================================================================

rules:
  # Base project conventions
  base: .kodla/rules/base.md

# =============================================================================
# Git Settings
# =============================================================================

git:
  # Whether this project uses git-aware workflows
  enabled: true

  # Language for Conventional Commit messages
  # Default: en
  commit_language: en

  # Skip the push prompt after creating a commit
  # Default: true
  skip_push_after_commit: true

  # Default branch for diff/review/merge targets
  base_branch: main

  # Automatically create feature branches for plans
  create_branches: true

  # Branch name prefix for new features
  branch_prefix: feature/
