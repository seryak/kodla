# Template: Node.js project, single docker backend
# All steps run in Docker containers on a docker-backend Woodpecker agent
#
# Substitutions:
#   {{BRANCH}}       - target branch (e.g. master, main)
#   {{PROJECT_NAME}} - project name from package.json or directory

labels:
  backend: docker

when:
  - event: push
    branch: {{BRANCH}}

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false  # REQUIRED: prevents "git: 'lfs' is not a git command" error

steps:
  - name: install
    image: node:22-alpine
    commands:
      - npm ci

  - name: test
    image: node:22-alpine
    commands:
      - npm test

  - name: build
    image: node:22-alpine
    commands:
      - npm run build
